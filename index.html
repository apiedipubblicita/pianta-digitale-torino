<!DOCTYPE html>
<html>

<head>
  <title>T2000 in Tour – Torino 2026</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#881814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mappa Torino 2026" />
  <!-- Preconnect a CDN/API Mappedin per ridurre latenza handshake -->
  <link rel="preconnect" href="https://app.mappedin.com" crossorigin />
  <link rel="preconnect" href="https://tiles.mappedin.com" crossorigin />
  <link rel="preconnect" href="https://styles.mappedin.com" crossorigin />
  <link rel="dns-prefetch" href="https://app.mappedin.com" />
  <link rel="dns-prefetch" href="https://tiles.mappedin.com" />
  <link rel="dns-prefetch" href="https://styles.mappedin.com" />
  <link rel="preload" as="image" href="/t2000-logo.svg" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" />
  <link rel="icon" href="/t2000-logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/t2000-logo.svg" />
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    #mappedin-map {
      height: 100%;
      width: 100%;
      position: relative;
      background: #f5f5f5;
    }
    #map-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #f5f5f5;
      z-index: 50;
      font-family: 'Onest', system-ui, sans-serif;
      color: #54595F;
      transition: opacity 0.4s ease;
    }
    #map-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #map-loader .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #d9d9d9;
      border-top-color: #881814;
      border-radius: 50%;
      animation: ml-spin 0.9s linear infinite;
    }
    @keyframes ml-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="mappedin-map">
    <div id="map-loader">
      <div class="spinner"></div>
      <div>Caricamento mappa…</div>
    </div>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>

</html>
